<text x="620" y="30" font-family="DejaVu Sans, Arial" font-size="15" font-weight="700" text-anchor="middle">AÇIK — tetik sıkılı</text>
<text x="1080" y="64" font-family="DejaVu Sans, Arial" font-size="15" font-weight="700">Parçalar</text>
<rect x="1080" y="80" width="16" height="16" rx="3" fill="#c2603a" stroke="#1d1d1f" stroke-width="0.8"/>
<text x="1104" y="92" font-family="DejaVu Sans, Arial" font-size="12.5" font-weight="600">Hazne</text>
<text x="1104" y="106" font-family="DejaVu Sans, Arial" font-size="11" fill="#555">silme dolum = 15 mL</text>
<rect x="1080" y="112" width="16" height="16" rx="3" fill="#2f8f5b" stroke="#1d1d1f" stroke-width="0.8"/>
<text x="1104" y="124" font-family="DejaVu Sans, Arial" font-size="12.5" font-weight="600">Kapak + tetik</text>
<text x="1104" y="138" font-family="DejaVu Sans, Arial" font-size="11" fill="#555">taban komple acilir, 65 derece</text>
<rect x="1080" y="144" width="16" height="16" rx="3" fill="#7d5aa6" stroke="#1d1d1f" stroke-width="0.8"/>
<text x="1104" y="156" font-family="DejaVu Sans, Arial" font-size="12.5" font-weight="600">Sap</text>
<text x="1104" y="170" font-family="DejaVu Sans, Arial" font-size="11" fill="#555">ayri parca, iki boyda ortak</text>
<rect x="1080" y="176" width="16" height="16" rx="3" fill="#37699c" stroke="#1d1d1f" stroke-width="0.8"/>
<text x="1104" y="188" font-family="DejaVu Sans, Arial" font-size="12.5" font-weight="600">Huni</text>
<text x="1104" y="202" font-family="DejaVu Sans, Arial" font-size="11" fill="#555">pet sise icin</text>
<rect x="1080" y="208" width="16" height="16" rx="3" fill="#d9b88a" stroke="#1d1d1f" stroke-width="0.8"/>
<text x="1104" y="220" font-family="DejaVu Sans, Arial" font-size="12.5" font-weight="600">Toz</text>
<text x="1104" y="234" font-family="DejaVu Sans, Arial" font-size="11" fill="#555">5.2 - 8.2 g</text>
<text x="1080" y="268" font-family="DejaVu Sans, Arial" font-size="15" font-weight="700">Ölçüler</text>
<text x="1080" y="294" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Gozenek: Ø38 mm, hicbir daralma yok</text>
<text x="1080" y="315" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• 65 derecede gercekten acik: 792 mm² (%70)</text>
<text x="1080" y="336" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Hazne derinligi 13.4 mm, h/D = 0.35</text>
<text x="1080" y="357" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Tetik stroku 17.8 mm</text>
<text x="1080" y="378" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Kapak, tum strok boyunca hicbir parcaya degmiyor</text>
<text x="1080" y="399" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Huni bogazi Ø20.4 mm (PCO-1881 kovani 21.7)</text>
<text x="1080" y="436" font-family="DejaVu Sans, Arial" font-size="11" fill="#777">Kesitler modelden y=0 düzlemiyle alınmıştır.</text>
</svg>