<text x="760" y="285" font-family="DejaVu Sans, Arial" font-size="15" font-weight="700">Ana ölçüler</text>
<text x="760" y="310" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Hazne ic capi: Ø34 mm</text>
<text x="760" y="330" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• 15 mL dolum yuksekligi: 19.0 mm</text>
<text x="760" y="350" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Koltuk: Ø15 → Ø19, 45° konik</text>
<text x="760" y="370" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Platform capi: Ø21 mm, strok 5 mm</text>
<text x="760" y="390" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Bosaltma borusu: Ø19.0 mm (PCO-1881 uyumlu)</text>
<text x="760" y="410" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Acikken akis kesiti: ~85 mm² (30 mL ~0,8 sn)</text>
<text x="760" y="430" font-family="DejaVu Sans, Arial" font-size="11.5" fill="#333">• Toplam yukseklik: 106 mm</text>
<text x="760" y="470" font-family="DejaVu Sans, Arial" font-size="11" fill="#777">Kesit — 15 mL. 30 mL modeli yalniz hazne yüksekliği ile ayrılır.</text>
